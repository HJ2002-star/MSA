rabbitmq:
  envFromSecretRefs:
    - rabbitmq-server-credentials

mongodb:
  envFromSecretRefs:
    - mongodb-server-credentials

mysql:
  envFromSecretRefs:
    - mysql-server-credentials

auth-server:
  envFromSecretRefs:
    - rabbitmq-credentials

product:
  image:
    name: native-product-service
  envFromSecretRefs:
    - rabbitmq-credentials
    - mongodb-credentials

recommendation:
  image:
    name: native-recommendation-service
  envFromSecretRefs:
    - rabbitmq-credentials
    - mongodb-credentials

review:
  image:
    name: native-review-service
  envFromSecretRefs:
    - rabbitmq-credentials
    - mysql-credentials

product-composite:
  image:
    name: native-product-composite-service
  envFromSecretRefs:
    - rabbitmq-credentials
  readinessProbe:
    httpGet:
      path: /actuator/info

destinationRules:
  - name: product-composite
  - name: auth-server
  - name: product
  - name: recommendation
  - name: review
