# 복사: cp secrets.example.yaml secrets.local.yaml 후 값을 채운다
# 설치: helm install <릴리스> environments/dev-env-native -f environments/dev-env-native/secrets.local.yaml -n hands-on
secrets:

  rabbitmq-server-credentials:
    RABBITMQ_DEFAULT_USER: 
    RABBITMQ_DEFAULT_PASS: 

  rabbitmq-credentials:
    SPRING_RABBITMQ_USERNAME: 
    SPRING_RABBITMQ_PASSWORD: 

  mongodb-server-credentials:
    MONGO_INITDB_ROOT_USERNAME: 
    MONGO_INITDB_ROOT_PASSWORD: 

  mongodb-credentials:
    SPRING_MONGODB_AUTHENTICATION_DATABASE: admin
    SPRING_MONGODB_USERNAME: 
    SPRING_MONGODB_PASSWORD: 

  mysql-server-credentials:
    MYSQL_ROOT_PASSWORD: 
    MYSQL_DATABASE: review-db
    MYSQL_USER: 
    MYSQL_PASSWORD: 

  mysql-credentials:
    SPRING_DATASOURCE_USERNAME: 
    SPRING_DATASOURCE_PASSWORD: 
